<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>toast notification</title>
</head>
<body>
    <main>
        <h1>Example of the toast notification</h1>
    </main>

    <div class="toast" role="status" aria-live="polite">
        <div class="toast-content">
            <strong class="toast__title">Notification</strong>
            <p class="toast__message">This is a toast notification.</p>

            <button class="toast__close" aria-label="Close notification">&times;</button>
        </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
