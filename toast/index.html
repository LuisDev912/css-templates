<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>toast notification</title>
</head>
<body>
    <main>
        <h1>Example of the toast notification</h1>

        <section class="buttons">
            <button id="showToast" class="button example" data-type="example" type="button">Show Toast example</button>

            <button id="showSuccessToast" class="button success" data-type="success">Show Toast success</button>
            
            <button id="showErrorToast" class="button error" data-type="error">Show Toast error</button>
        </section>
    </main>

    <div 
        class="toast" 
        role="status" 
        aria-live="polite" 
        aria-labelledby="toast-title" 
        aria-describedby="toast-message"
    >
        <div class="toast-content">
            <div class="toast__heading">
                <strong 
                    class="toast__title"
                    id="toast-title"
                >
                    Notification
                </strong>

                <button 
                    class="toast__close" 
                    type="button"
                    aria-label="Close notification"
                >
                    &times;
                </button>
            </div>
            
            <p 
                class="toast__message" 
                id="toast-message"
            >
                This is a toast notification. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>
        </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
