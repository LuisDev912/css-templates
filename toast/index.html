<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>toast notification</title>
</head>
<body>
    <main>
        <h1>Example of the toast notification</h1>

        <button id="showToast">Show Toast</button>
    </main>

    <div class="toast" role="status" aria-live="polite">
        <div class="toast-content">
            <div class="toast__heading">
                <strong class="toast__title">Notification</strong>

                <button class="toast__close" aria-label="Close notification">&times;</button>
            </div>
            
            <p class="toast__message">This is a toast notification. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
